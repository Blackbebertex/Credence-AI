name: credence-gov

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16-bookworm
    profiles: [dev, test]
    environment:
      POSTGRES_DB: credence
      POSTGRES_USER: credence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local-only values}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credence -d credence"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]

  redis:
    image: redis:7.4.11-alpine
    profiles: [dev, test]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]

  minio:
    # Development-only candidate. Upstream OSS project is archived; not production approved.
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    profiles: [dev]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set local-only MinIO credentials in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set local-only MinIO credentials in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [app_net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    profiles: [dev]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set local-only Keycloak password in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/credence-dev-realm.json:ro
    networks: [app_net]

  clamav:
    image: clamav/clamav:1.4.6-debian13-slim
    profiles: [dev]
    expose: ["3310"]
    networks: [app_net]

networks:
  app_net:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
